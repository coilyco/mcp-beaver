[tool.agentic-os.repo-pointer-skills]
org = "coilyco-flight-deck"

# The README carries the product banner, and the two lines it takes put a file
# that already sat at 159 over the 160-line trifecta cap.
[tool.agentic-os.documentation-layout]
band = "large"
readme_max_lines = 172

# The managed markers are stamped inside the pre-commit YAML and cannot form a
# single top-of-file comment block. The Go source, chart, and examples predate
# enrollment and carry 785 violations, tracked separately.
[tool.agentic-os.code-comments]
excludes = [
  ".pre-commit-config.yaml",
  "cmd/**",
  "internal/**",
  "chart/**",
  "examples/**",
]
