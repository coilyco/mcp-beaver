# Binary release train, separate from ci.yml's image publish. Tagging, the major-bump
# dispatch, and the hold file: docs/release.md.
name: release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing or explicit version tag for a retry."
        required: false
        default: ""
      bump:
        description: "Version bump when tag is empty."
        required: false
        default: "minor"
        type: choice
        options: [minor, patch, major]

concurrency:
  group: release-pipeline
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - uses: coilyco/.github/actions/setup-ci@b975f9dbb2a7c7dd7315f4b53dd3212c9b1e2685
        with:
          tools: just

      - name: Validate the release commit
        run: just test

      - id: impact
        name: Classify release impact
        env:
          RELEASE_EVENT: ${{ github.event_name }}
          RELEASE_BASE: ${{ github.event.before }}
          RELEASE_HEAD: ${{ github.sha }}
        run: sh scripts/ci/release-impact.sh

      - id: app
        name: Mint a coilyco-ops App token for the tag, release and tap
        if: ${{ steps.impact.outputs.publish == 'true' }}
        uses: coilyco/.github/actions/app-token@b975f9dbb2a7c7dd7315f4b53dd3212c9b1e2685
        with:
          app_id: ${{ secrets.COILYCO_OPS_APP_ID }}
          private_key_base64: ${{ secrets.COILYCO_OPS_APP_PRIVATE_KEY_BASE64 }}
          repositories: mcp-beaver,homebrew-tap

      - id: tag
        if: ${{ steps.impact.outputs.publish == 'true' }}
        uses: coilyco/.github/actions/tag-bump@b975f9dbb2a7c7dd7315f4b53dd3212c9b1e2685
        with:
          token: ${{ steps.app.outputs.token }}
          bump: ${{ github.event.inputs.bump || 'minor' }}
          tag_name: ${{ github.event.inputs.tag || '' }}
          create_tag: true
          release_sha: ${{ github.sha }}

      - name: Fetch the release tag into the build checkout
        if: ${{ steps.impact.outputs.publish == 'true' }}
        run: git fetch --tags --force

      - name: Build binaries and package metadata
        if: ${{ steps.impact.outputs.publish == 'true' }}
        run: sh scripts/ci/release-build.sh

      - id: create
        if: ${{ steps.impact.outputs.publish == 'true' }}
        uses: coilyco/.github/actions/create-release@b975f9dbb2a7c7dd7315f4b53dd3212c9b1e2685
        with:
          token: ${{ steps.app.outputs.token }}
          tag: ${{ steps.tag.outputs.new_tag }}
          name: mcp-beaver ${{ steps.tag.outputs.new_tag }}
          body: ${{ steps.tag.outputs.changelog }}

      - name: Attach release artifacts
        if: ${{ steps.impact.outputs.publish == 'true' }}
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          TAG: ${{ steps.tag.outputs.new_tag }}
        run: sh scripts/ci/release-attach-assets.sh

      - name: Update the Homebrew tap
        if: ${{ steps.impact.outputs.publish == 'true' }}
        env:
          TAP_TOKEN: ${{ steps.app.outputs.token }}
          TAG: ${{ steps.tag.outputs.new_tag }}
        run: sh scripts/ci/release-publish-tap.sh

      - name: Alert Sentry on main failure
        if: ${{ failure() && github.ref == 'refs/heads/main' }}
        continue-on-error: true
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_CI_DSN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python3 scripts/alert_sentry.py
