# CI gate for mcp-beaver: build, vet, and test the generic runtime on every push,
# then - on a push to main or an authorized manual dispatch of main - publish
# the one runtime image to Forgejo OCI, keyed by the full source sha. Deploy
# consumes that exact reference. One generic image is published when the
# runtime source changes, not per guardfile (mcp-beaver#6, mount-not-bake).
#
# umbra is a private forgejo module fetched anonymously, so GOPRIVATE keeps
# it off the public proxy and sumdb (the go gate here and the Dockerfile build).
#
# `docker` is the only label this Forgejo instance's runners advertise, and it
# resolves to node:20-bookworm. `ubuntu-latest` is a GitHub-mirror label the
# Forgejo runner does not know, so a gate pinned to it matched no runner and
# the repo queued zero tasks (mcp-beaver#10).
#
# The gate covers more than the Go build. A chart change and a committed example
# guardfile both reach production without touching a Go file, and `go test`
# cannot see either. `check-app-mount` is the one that spans the chart-to-runtime
# seam: it renders the chart, materializes the mount as kubelet projects it, and
# lints the result with the real runtime, because both halves of mcp-beaver#110
# validated clean on their own while the pod failed at startup. They run through
# `just` so a verb cannot pass on a laptop and differ here, and the image
# carries go, helm, yq, and just already.
#
# A trusted main-only host runner publishes one private source-sha image and
# verifies the remote manifest after the source gate passes.
name: ci
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  gate:
    runs-on: docker
    container: forgejo.coilysiren.me/coilyco-flight-deck/agentic-os:release
    env:
      GOPRIVATE: forgejo.coilysiren.me
    steps:
      - uses: actions/checkout@v4
      - name: build
        run: go build ./...
      - name: vet
        run: go vet ./...
      - name: test
        run: go test ./...

      - name: lint examples
        run: just lint-examples
      - name: lint chart
        run: just helm-lint-chart
      - name: check app mount
        run: just check-app-mount

      - name: Alert Sentry on main failure
        if: ${{ failure() && github.ref == 'refs/heads/main' }}
        continue-on-error: true
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_CI_DSN }}
        run: python3 scripts/alert_sentry.py
  publish:
    runs-on: deploy
    needs: [gate]
    if: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Publish immutable image
        run: bash scripts/publish-image.sh
      - name: Alert Sentry on main failure
        if: ${{ failure() && github.ref == 'refs/heads/main' }}
        continue-on-error: true
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_CI_DSN }}
        run: python3 scripts/alert_sentry.py
